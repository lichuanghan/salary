<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F0C850"/>
      <stop offset="30%" style="stop-color:#FFE066"/>
      <stop offset="50%" style="stop-color:#FFF8DC"/>
      <stop offset="70%" style="stop-color:#FFE066"/>
      <stop offset="100%" style="stop-color:#DAA520"/>
    </linearGradient>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1814"/>
      <stop offset="100%" style="stop-color:#0d0c0a"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feFlood flood-color="#FFE066" flood-opacity="0.6"/>
      <feComposite in2="blur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Outer gold ring -->
  <circle cx="512" cy="512" r="480" fill="#DAA520"/>
  <circle cx="512" cy="512" r="465" fill="#FFE066"/>
  <circle cx="512" cy="512" r="455" fill="#F0C850"/>

  <!-- Inner dark circle -->
  <circle cx="512" cy="512" r="400" fill="url(#bgGradient)"/>

  <!-- Shine effect -->
  <ellipse cx="440" cy="360" rx="200" ry="160" fill="#FFF8DC" opacity="0.2"/>

  <!-- ¥ Symbol with glow -->
  <text x="512" y="640"
        font-family="Arial, sans-serif"
        font-size="450"
        font-weight="200"
        fill="#FFE066"
        text-anchor="middle"
        filter="url(#glow)"
        letter-spacing="-30">¥</text>

  <!-- Inner gold ring detail -->
  <circle cx="512" cy="512" r="415" fill="none" stroke="#FFE066" stroke-width="2" opacity="0.4"/>
</svg>